# Coolify "Docker Compose" resource (or plain `docker compose up -d`). Env vars: .env.example, docs/deployment.md.
# Postgres is an existing external instance reached through DATABASE_URL.
# Host dirs default to /opt/magpie/media and /opt/magpie/secrets/cookies (Coolify rewrites a ~ default into its own app directory, so an absolute path is the only one that stays where you put it); override with MEDIA_DIR / COOKIES_HOST_DIR.
x-common-env: &common-env
  DATABASE_URL: ${DATABASE_URL:?}
  MEDIA_SIGNING_SECRET: ${MEDIA_SIGNING_SECRET:?}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  STORAGE_LOCAL_ROOT: /data/media
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-pretty}

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  # one-shot: Docker creates missing bind-mount dirs as root, but the apps run as uid 1000
  init:
    image: busybox:1.37
    user: "0:0"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    command: >-
      sh -c "chown 1000:1000 /data/media &&
      chown -R 1000:1000 /cookies /sessions &&
      find /cookies -type f -exec chmod 600 {} + &&
      chmod 700 /cookies /sessions"
    volumes:
      - ${MEDIA_DIR:-/opt/magpie/media}:/data/media
      - ${COOKIES_HOST_DIR:-/opt/magpie/secrets/cookies}:/cookies
      - ${SESSIONS_HOST_DIR:-/opt/magpie/secrets/sessions}:/sessions
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    <<: *hardening
    environment:
      <<: *common-env
      PORT: 3000
      API_TOKEN: ${API_TOKEN:?}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      MEDIA_URL_TTL_SECONDS: ${MEDIA_URL_TTL_SECONDS:-3600}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      ADMIN_WEB_UI: ${ADMIN_WEB_UI:-true}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-invite}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISABLED_SOURCES: ${DISABLED_SOURCES:-}
    volumes:
      - ${MEDIA_DIR:-/opt/magpie/media}:/data/media
    tmpfs: [/tmp]
    depends_on:
      init: { condition: service_completed_successfully }
    expose: ["3000"]
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    <<: *hardening
    environment:
      <<: *common-env
      COOKIES_DIR: /run/secrets/cookies
      SESSIONS_DIR: /run/secrets/sessions
      INSTAGRAM_USERNAME: ${INSTAGRAM_USERNAME:-}
      INSTAGRAM_PASSWORD: ${INSTAGRAM_PASSWORD:-}
      WORKER_TMP_DIR: /tmp/magpie
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      DISABLED_SOURCES: ${DISABLED_SOURCES:-}
      DISABLED_STRATEGIES: ${DISABLED_STRATEGIES:-}
      EMBEDDER: ${EMBEDDER:-hash}
      MAX_VIDEO_MB: ${MAX_VIDEO_MB:-60}
      MAX_DOWNLOAD_MB: ${MAX_DOWNLOAD_MB:-500}
      AUTO_ASSIGN_THRESHOLD: ${AUTO_ASSIGN_THRESHOLD:-0.8}
    volumes:
      - ${MEDIA_DIR:-/opt/magpie/media}:/data/media
      - ${COOKIES_HOST_DIR:-/opt/magpie/secrets/cookies}:/run/secrets/cookies:ro
      - ${SESSIONS_HOST_DIR:-/opt/magpie/secrets/sessions}:/run/secrets/sessions
    # downloads land here before moving to the media volume
    tmpfs: ["/tmp:size=4g"]
    depends_on:
      api: { condition: service_healthy }
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
