# Asks Coolify to redeploy the server (it pulls the branch configured in Coolify and rebuilds).
# Runs at the end of release.yml, or by hand from the Actions tab.
# Secrets: COOLIFY_WEBHOOK (resource deploy URL), COOLIFY_TOKEN (Coolify API token with deploy permission).
name: Deploy

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      COOLIFY_WEBHOOK:
        required: true
      COOLIFY_TOKEN:
        required: true

permissions: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  coolify:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "::error::COOLIFY_WEBHOOK and COOLIFY_TOKEN repository secrets are required (docs/releases.md)"
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --retry 3 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
