# Builds and publishes a release when a `v<major>.<minor>.<patch>` tag is pushed.
# Procedure and one-time setup: docs/releases.md
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_changed: ${{ steps.app.outputs.changed }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # the version comes from package.json; the tag only triggers the run and must agree
      - name: Read version from package.json, check tag and changelog
        id: version
        run: |
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          node scripts/changelog.ts check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The APK is only rebuilt when something the app is built from changed since the last release
      # that shipped one (the one `releases/latest` points at; server-only releases stay pre-releases).
      - name: Did the app change?
        id: app
        run: |
          last="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)"
          if [ -z "$last" ] || ! git rev-parse -q --verify "refs/tags/$last" >/dev/null; then
            echo "no previous app release: building the app"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$last" "$GITHUB_SHA" -- apps/mobile packages/shared ':(exclude)packages/shared/src/env' scripts/changelog.ts pnpm-workspace.yaml .nvmrc)"
          if [ -n "$changed" ]; then
            echo "app changed since $last:"; echo "$changed"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "no app changes since $last: server-only release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  android:
    if: needs.verify.outputs.app_changed == 'true'
    needs: [verify, release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # Caches are scoped by ref: a tag run only reads its own (always empty) ref and `main`. So this
      # job only restores; android-cache.yml saves them from `main`. Saving here would be wasted.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      # Native modules (reanimated, nitro, screens, ...) are compiled for every ABI; ccache makes
      # unchanged C++ a cache hit.
      - name: Install ccache
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ccache
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-unused
          restore-keys: ccache-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile

      - name: Prebuild native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Signing config is injected by apps/mobile/plugins/with-release-signing.ts from these vars.
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          MAGPIE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MAGPIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAGPIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAGPIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # CMake reads these as the default compiler launcher
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 1G
        run: |
          export CCACHE_DIR="$HOME/.cache/ccache"
          ./gradlew assembleRelease --no-daemon --build-cache
          ccache --show-stats

      - name: Collect APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/magpie-$VERSION.apk"

      - name: Attach APK to the release
        run: |
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --clobber

      # The release was created as a pre-release so `releases/latest` (what the app's update check
      # reads) keeps pointing at the previous version until this APK exists.
      - name: Publish as the latest release
        run: gh release edit "$GITHUB_REF_NAME" --prerelease=false --latest

  # Created right after verify so the release page exists immediately; the APK is attached by the android job,
  # which then promotes it from pre-release to latest. Until then the app does not offer it as an update.
  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      APP_CHANGED: ${{ needs.verify.outputs.app_changed }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Write release notes
        run: |
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          {
            node scripts/changelog.ts notes "$VERSION"
            echo
            echo "## Install"
            echo
            if [ "$APP_CHANGED" = "true" ]; then
              echo "**Android:** \`magpie-$VERSION.apk\` is attached below once the build finishes (a few minutes after the release appears). Open it on the device (allow installs from unknown sources); it updates an existing install in place."
            else
              echo "**Android:** server-only release. The app did not change, so there is no new APK; keep using your installed version."
            fi
            echo
            echo "**Server:** redeploy the Docker Compose resource from this tag. Database migrations run automatically when the API container starts."
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > notes.md

      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Magpie $VERSION" \
            --notes-file notes.md \
            --prerelease \
            --verify-tag

  # The server does not wait for the APK: Coolify builds the images itself, so deploy right after verify.
  deploy:
    needs: verify
    uses: ./.github/workflows/deploy.yml
    secrets:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
