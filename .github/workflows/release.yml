# Builds and publishes a release when a `v<major>.<minor>.<patch>` tag is pushed.
# Procedure and one-time setup: docs/releases.md
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # the version comes from package.json; the tag only triggers the run and must agree
      - name: Read version from package.json, check tag and changelog
        id: version
        run: |
          version="$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          node scripts/changelog.ts check "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  android:
    needs: verify
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile

      - name: Prebuild native project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --clean --no-install

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Signing config is injected by apps/mobile/plugins/with-release-signing.ts from these vars.
      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          MAGPIE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MAGPIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAGPIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAGPIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "dist/magpie-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/
          if-no-files-found: error

  images:
    needs: verify
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [api, worker]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:latest
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  publish:
    needs: [verify, android, images]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist/

      - name: Write release notes
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}"
          previous="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          (cd dist && sha256sum -- *.apk > SHA256SUMS)
          {
            node scripts/changelog.ts notes "$VERSION"
            echo
            echo "## Install"
            echo
            echo "**Android:** download \`magpie-$VERSION.apk\` below and open it on the device (allow installs from unknown sources). It updates an existing install in place."
            echo
            echo "**Server:**"
            echo
            echo '```sh'
            echo "docker pull $image-api:$VERSION"
            echo "docker pull $image-worker:$VERSION"
            echo '```'
            echo
            echo "Database migrations run automatically when the API container starts."
            if [ -n "$previous" ]; then
              echo
              echo "**Full diff:** https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > notes.md

      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --title "Magpie $VERSION" \
            --notes-file notes.md \
            --verify-tag

  deploy:
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets:
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
